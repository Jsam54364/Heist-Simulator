name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_CHANNEL: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-35"

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-${GODOT_CHANNEL}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          wget -q "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q "Godot_v${V}_linux.x86_64.zip"
          mv "Godot_v${V}_linux.x86_64" godot
          chmod +x godot
          wget -q "${BASE}/Godot_v${V}_export_templates.tpz"
          unzip -q "Godot_v${V}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/
          rm -rf templates *.zip *.tpz

      - name: Configure Godot editor settings (Android SDK + debug keystore)
        run: |
          set -e
          MAJMIN=$(echo "$GODOT_VERSION" | cut -d. -f1-2)
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${MAJMIN}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${MAJMIN}.tres
          cat ~/.config/godot/editor_settings-${MAJMIN}.tres

      - name: Import project
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tail -n 20 || true

      - name: Smoke test (headless gameplay scenarios)
        run: |
          set -o pipefail
          timeout 600 ~/godot/godot --headless --path . --fixed-fps 60 res://scenes/tests/smoke.tscn 2>&1 | tee smoke.log | grep -E "PASS|FAIL|RESULT|SCRIPT ERROR|build ms" || true
          echo '### Smoke test' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "PASS|FAIL|RESULT|SCRIPT ERROR" smoke.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android" build/heist-simulator.apk 2>&1 | tee export.log
          test -s build/heist-simulator.apk || { echo "APK missing"; exit 1; }
          ls -la build

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/*/apksigner | tail -n 1)
          $APKSIGNER verify --print-certs build/heist-simulator.apk | head -n 5
          SIZE=$(du -h build/heist-simulator.apk | cut -f1)
          echo "### APK built: ${SIZE}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: heist-simulator-apk
          path: build/heist-simulator.apk
          retention-days: 14

      - name: Publish to "latest-apk" release (phone download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHORT=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk build/heist-simulator.apk \
            --prerelease \
            --title "Latest APK (${SHORT})" \
            --notes "Built from ${SHORT}: ${MSG}. Open this page on your phone and tap heist-simulator.apk to install (allow installs from your browser). New builds install over old ones." \
            --target "${GITHUB_SHA}"
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-apk/heist-simulator.apk" >> "$GITHUB_STEP_SUMMARY"
